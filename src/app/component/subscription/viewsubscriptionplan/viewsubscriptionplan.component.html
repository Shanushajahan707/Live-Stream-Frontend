<div class="flex flex-col items-center mb-12 p-6 sm:p-8">
  <h1 class="text-2xl sm:text-3xl font-bold text-white mb-8 animate-fade-in">Available Subscription Plans</h1>
  <div id="pricing-table" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 w-full max-w-5xl">
    <div *ngFor="let plan of channelPlans" class="plan bg-gray-900 bg-opacity-95 rounded-2xl shadow-lg p-6 flex flex-col items-center transition-all duration-300 hover:shadow-xl">
      <div class="w-full text-center mb-6">
        <h3 class="text-xl font-semibold text-white">{{ plan.month }} Month</h3>
        <div class="mt-4">
          <span class="bg-blue-500 text-white w-20 h-20 flex items-center justify-center rounded-full text-lg font-bold">{{ plan.price }} ₹</span>
        </div>
      </div>
      <ul class="text-gray-400 space-y-4 text-center">
        <li *ngFor="let desc of plan.description" class="py-2 flex items-center justify-center">
          <i class="fas fa-check-circle text-blue-500 mr-3"></i>
          <span class="text-sm">{{ desc.desc }}</span>
        </li>
      </ul>
    </div>
  </div>
</div>

<style>
@keyframes fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.5s ease-out;
}

#pricing-table .plan {
  border: 1px solid rgba(75, 85, 99, 0.3);
  backdrop-filter: blur(8px);
}

#pricing-table .plan:hover {
  transform: translateY(-5px);
}

#pricing-table .plan .bg-blue-500 {
  transition: transform 0.3s ease-in-out;
}

#pricing-table .plan:hover .bg-blue-500 {
  transform: scale(1.1);
}
</style>
