<div id="chat" class="flex flex-col w-full h-full bg-gradient-to-br from-gray-900 to-gray-800 pt-16">
  <!-- Messages container -->
  <div class="flex flex-col flex-1 overflow-y-auto text-white p-4 space-y-4">
    <div *ngFor="let message of messages" class="flex flex-col my-2">
      <div class="flex flex-col items-start px-4 py-2 rounded-lg shadow-md"
           [ngClass]="message.sender === 'Delivery Notification' || message.sender === 'Group Chat' ? 'bg-blue-600/30' : 'bg-gray-800/50'">
        <span class="font-semibold text-blue-300">{{ message.sender }}</span>
        <span class="text-sm">{{ message.content }}</span>
      </div>
      <span class="text-xs text-gray-300 pl-4">{{ message.timestamp }}</span>
    </div>
  </div>
  <!-- Input box -->
  <div *ngIf="_isLogged" class="p-4 bg-gray-800/70 flex items-center">
    <input
      type="text"
      placeholder="Type your message..."
      class="w-full p-3 border border-gray-600 rounded-full bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"
    />
    <button  class="ml-2 p-3 bg-gradient-to-r from-blue-500 to-blue-700 rounded-full text-white hover:from-blue-600 hover:to-blue-800 transition-all duration-300">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>
