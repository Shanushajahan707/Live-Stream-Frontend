<div class="w-full h-screen flex bg-gray-900">
  <!-- Recommendation Sidebar -->
  <div class="w-2/12 hidden md:block bg-gray-900 h-screen sticky top-0 overflow-y-auto">
    <app-recommendation></app-recommendation>
  </div>
  <!-- Main Content -->
  <div class="w-full md:w-10/12 bg-gray-900 text-white">
    <div class="flex flex-col h-full md:px-8 md:py-20 py-8 overflow-y-auto">
      <div class="md:max-w-7xl w-full mx-auto">
        <div class="ps-7 mb-10">
          <h1 class="text-4xl font-bold text-white tracking-wide">Followed Channels</h1>
        </div>
        <div *ngIf="_followedChannels && _followedChannels.length > 0">
          <p-carousel
            [value]="_followedChannels"
            [numVisible]="3"
            [numScroll]="3"
            [responsiveOptions]="_responsiveOptions"
            class="gap-6"
          >
            <ng-template let-channel pTemplate="item">
              <!-- Individual Channel Card -->
              <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg hover:shadow-xl transition-shadow duration-300 transform hover:-translate-y-1">
                <div class="relative">
                  <img
                    src="{{_apiUrl}}/channelBanner/{{ channel.banner }}"
                    alt="Channel Image"
                    class="w-full h-56 object-cover object-center"
            onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop';"
                  />
                  <div class="absolute inset-0 bg-gradient-to-t from-gray-900/70 to-transparent"></div>
                </div>
                <div class="px-6 py-4">
                  <div class="font-bold text-xl mb-2 text-white tracking-tight">
                    {{ channel.channelName }}
                  </div>
                  <p class="text-gray-300 text-sm line-clamp-2">
                    {{ channel.description }}
                  </p>
                  <div class="mt-4 flex justify-between items-center">
                    <a
                      [routerLink]="['/channel/following', channel._id]"
                      class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-full transition-all duration-300"
                    >
                      View Channel
                    </a>
                    <div class="text-gray-300 text-sm flex items-center">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 20 20"
                        fill="currentColor"
                        class="w-5 h-5 inline-block mr-1"
                      >
                        <path
                          fill-rule="evenodd"
                          d="M6.27 2.12a1 1 0 011.41 0l6 6a1 1 0 01-1.41 1.41L10 5.41V16a1 1 0 01-2 0V5.41L5.66 9.53a1 1 0 01-1.41-1.41l6-6z"
                          clip-rule="evenodd"
                        />
                      </svg>
                      <span>{{ channel.followers.length }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </ng-template>
          </p-carousel>
        </div>
        <div *ngIf="!_followedChannels || _followedChannels.length === 0">
          <div class="text-center py-10 bg-gray-800/50 rounded-lg">
            <p class="text-gray-300 text-lg">No followed channels found.</p>
            <p class="text-gray-400 text-sm mt-2">Start following channels to see them here!</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
