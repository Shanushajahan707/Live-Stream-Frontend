<div class="h-full flex bg-gradient-to-br from-gray-900 to-gray-800">
  <!-- Sidebar Toggle Button (Hamburger Menu) for Small Devices -->
  <button
    class="lg:hidden  p-4 focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-md transition-all duration-300"
    (click)="sidebarVisible = !sidebarVisible"
    
  >
    <i class="fas fa-bars text-gray-300 text-xl hover:text-blue-400 transition-colors duration-300"></i>
  </button>

  <!-- Sidebar for Small Devices -->
  <p-sidebar [(visible)]="sidebarVisible" class="lg:hidden" [style]="{'background': 'linear-gradient(to bottom, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.9))', 'backdrop-filter': 'blur(8px)', 'width': '16rem'}">
    <div class="flex flex-col h-full p-6">
      <h2 class="text-xl font-bold text-white mb-6">Menu</h2>
      <ul class="nav flex flex-col">
        <li>
          <a
            (click)="subscriptionview(); sidebarVisible = false"
            [routerLink]="['/subscription/view']"
            [routerLinkActive]="['active-link']"
            class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
          >
            <i class="fas fa-user-check mr-3 text-blue-500"></i> Subscription View
          </a>
        </li>
        <li>
          <a
            (click)="members(); sidebarVisible = false"
            [routerLink]="['/subscription/members']"
            [routerLinkActive]="['active-link']"
            class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
          >
            <i class="fa-solid fa-user-plus mr-3 text-blue-500"></i> Members
          </a>
        </li>
        <li>
          <a
            (click)="revenue(); sidebarVisible = false"
            [routerLink]="['/subscription/revenuechart']"
            [routerLinkActive]="['active-link']"
            class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
          >
            <i class="fa-solid fa-dollar-sign mr-3 text-blue-500"></i> Revenue
          </a>
        </li>
      </ul>
    </div>
  </p-sidebar>

  <!-- Sidebar for Large Devices (Hidden on Small Devices) -->
  <div
    id="sidebar-lg"
    class="hidden lg:block w-64 h-screen p-6 bg-gray-800 bg-opacity-90 backdrop-blur-lg"
    style="background: linear-gradient(to bottom, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.9));"
  >
    <h2 class="text-xl font-bold text-white mb-6">Menu</h2>
    <ul class="nav flex flex-col">
      <li>
        <a
          routerLink="/subscription/view"
          [routerLinkActive]="['active-link']"
          class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
        >
          <i class="fas fa-user-check mr-3 text-blue-500"></i> Subscription View
        </a>
      </li>
      <li>
        <a
          routerLink="/subscription/members"
          [routerLinkActive]="['active-link']"
          class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
        >
          <i class="fa-solid fa-user-plus mr-3 text-blue-500"></i> Members
        </a>
      </li>
      <li>
        <a
          routerLink="/subscription/revenuechart"
          [routerLinkActive]="['active-link']"
          class="flex items-center py-3 px-4 text-gray-300 hover:text-white hover:bg-gray-700 hover:bg-opacity-50 rounded-md transition-all duration-300"
        >
          <i class="fa-solid fa-dollar-sign mr-3 text-blue-500"></i> Revenue
        </a>
      </li>
    </ul>
  </div>
