<!-- Recommended Channels -->
<h2
  class="text-base sm:text-lg md:text-xl text-white font-bold mb-3 sm:mb-4 px-2 sm:px-0 animate-fade-in relative inline-block"
>
  Recommended Channels
  <span class="absolute left-0 bottom-0 w-0 h-[2px] bg-gradient-to-r from-blue-500 to-green-400 transition-all duration-300 group-hover:w-full"></span>
</h2>

<div class="card relative w-full px-2 sm:px-0">
  <p-carousel
    [value]="_recommendedChannels"
    [numVisible]="3"
    [numScroll]="1"
    [responsiveOptions]="_responsiveOptions"
  >
    <ng-template let-channel pTemplate="item">
      <div
        class="p-1 sm:p-2 m-1 sm:m-3 rounded-xl card bg-gray-800 bg-opacity-70 backdrop-blur-md shadow-lg hover:shadow-2xl hover:shadow-blue-500/30 transition-all duration-300 transform hover:-translate-y-1 animate-slide-up"
      >
        <div class="relative">
          <img
            src="{{ _apiUrl }}/channelBanner/{{ channel.banner }}"
            alt="Channel Banner"
            class="w-full h-32 sm:h-40 md:h-56 rounded-xl mb-1 sm:mb-2 object-cover transition-transform duration-300 hover:scale-105"
            onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920&auto=format&fit=crop';"
          />
        </div>
        <div class="mt-1 sm:mt-2 px-1 sm:px-2">
          <p
            class="text-xs sm:text-sm md:text-base text-white font-semibold truncate"
          >
            {{ channel.channelName }}
          </p>
          <p
            class="text-[10px] sm:text-xs md:text-sm text-gray-300 flex items-center"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-2 h-2 sm:w-3 sm:h-3 md:w-4 md:h-4 inline-block mr-1 text-blue-400"
            >
              <path d="M12 20v-6m0 0V4m0 10h6m-6 0H6"></path>
            </svg>
            {{ channel.followers.length }} Followers
          </p>
        </div>
        <div
          class="mt-2 sm:mt-3 md:mt-4 flex justify-between items-center px-1 sm:px-2"
        >
          <button
            *ngIf="_followedChannels.includes(channel._id); else followw"
            type="button"
            (click)="unFollow(channel)"
            class="bg-gradient-to-r from-green-600 to-green-500 hover:from-green-500 hover:to-green-400 text-white font-semibold text-[10px] sm:text-xs md:text-sm py-1 sm:py-1.5 md:py-2 px-2 sm:px-3 md:px-4 rounded-full transition-all duration-300 hover:scale-105 shadow-md"
          >
            Unfollow
          </button>
          <ng-template #followw>
            <button
              type="button"
              (click)="follow(channel)"
              class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold text-[10px] sm:text-xs md:text-sm py-1 sm:py-1.5 md:py-2 px-2 sm:px-3 md:px-4 rounded-full transition-all duration-300 hover:scale-105 shadow-md"
            >
              Follow
            </button>
            
          </ng-template>
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>

<!-- Recommended Lives -->
<h2
  class="text-base sm:text-lg md:text-xl text-white font-bold mt-6 sm:mt-8 md:mt-10 mb-3 sm:mb-4 px-2 sm:px-0 animate-fade-in relative inline-block"
>
  Recommended Lives
  <span class="absolute left-0 bottom-0 w-0 h-[2px] bg-gradient-to-r from-blue-500 to-green-400 transition-all duration-300 group-hover:w-full"></span>
</h2>

<div class="card relative w-full px-2 sm:px-0">
  <ng-container
    *ngIf="
      _recommendedLives && _recommendedLives.length > 0;
      else noLivesTemplate
    "
  >
    <p-carousel
      [value]="_recommendedLives"
      [numVisible]="3"
      [numScroll]="1"
      [responsiveOptions]="_responsiveOptions"
    >
      <ng-template let-channel pTemplate="item">
        <div
          class="p-1 sm:p-2 m-1 sm:m-3 rounded-xl card bg-gray-800 bg-opacity-70 backdrop-blur-md shadow-lg hover:shadow-2xl hover:shadow-blue-500/30 transition-all duration-300 transform hover:-translate-y-1 animate-slide-up"
        >
          <div class="relative">
            <img
              src="{{ _apiUrl }}/channelBanner/{{ channel.banner }}"
              alt="Channel Banner"
              class="w-full h-32 sm:h-40 md:h-56 rounded-xl mb-1 sm:mb-2 object-cover transition-transform duration-300 hover:scale-105"
              onerror="this.src='https://images.unsplash.com/photo-1557683311-eac922347aa1?q=80&w=1920&auto=format&fit=crop';"
            />
            <div
              *ngIf="channel.isLive"
              class="absolute top-1 sm:top-2 left-1 sm:left-2 flex items-center bg-gray-900/90 rounded-full px-1.5 sm:px-2 py-0.5 sm:py-1 shadow-md"
            >
              <div
                class="h-2 w-2 sm:h-3 sm:w-3 rounded-full mr-1 bg-red-500 animate-pulse"
              ></div>
              <p
                class="text-[10px] sm:text-xs md:text-sm font-semibold text-white"
              >
                On Air
              </p>
            </div>
          </div>
          <div class="mt-1 sm:mt-2 px-1 sm:px-2">
            <p
              class="text-xs sm:text-sm md:text-base text-white font-semibold truncate"
            >
              {{ channel.channelName }}
            </p>
            <p
              class="text-[10px] sm:text-xs md:text-sm text-gray-300 flex items-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="w-2 h-2 sm:w-3 sm:h-3 md:w-4 md:h-4 inline-block mr-1 text-blue-400"
              >
                <path d="M12 20v-6m0 0V4m0 10h6m-6 0H6"></path>
              </svg>
              {{ channel.followers.length }} Followers
            </p>
            <div
              *ngIf="channel.isLive"
              class="flex items-center text-[10px] sm:text-xs md:text-sm text-gray-400 mt-0.5 sm:mt-1 truncate"
            >
              <p class="truncate">Room: {{ channel?.liveRoom }}</p>
              <button
                (click)="copyToClipboard(channel?.liveRoom)"
                class="ml-2 relative flex items-center bg-gray-700/50 hover:bg-blue-500/30 text-gray-200 hover:text-white rounded-full p-1 sm:p-1.5 transition-all duration-200 group"
                title="Copy to clipboard"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-3 h-3 sm:w-4 sm:h-4"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                  ></path>
                </svg>
                <span
                  class="absolute hidden group-hover:block -top-8 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-xs rounded px-2 py-1 whitespace-nowrap"
                >
                  Copy Room ID
                </span>
              </button>
            </div>
          </div>
        </div>
      </ng-template>
    </p-carousel>
  </ng-container>

  <ng-template #noLivesTemplate>
    <div
      class="p-2 sm:p-3 md:p-4 text-center my-6 sm:my-8 md:my-10 bg-gradient-to-br from-gray-800 to-gray-700 rounded-xl shadow-lg border border-gray-600 animate-fade-in mx-2 sm:mx-0"
    >
      <p class="text-sm sm:text-base md:text-lg text-gray-300">
        No live streams available.
      </p>
      <p class="text-[10px] sm:text-xs md:text-sm text-gray-400 mt-1">
        Check back later for exciting live sessions!
      </p>
    </div>
  </ng-template>
</div>
