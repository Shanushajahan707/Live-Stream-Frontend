<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 p-4 sm:p-6">
  <div class="relative max-w-6xl w-full flex bg-gray-800 bg-opacity-70 backdrop-blur-lg p-6 sm:p-8 rounded-xl shadow-xl mb-16 sm:mb-24">
    <!-- Left Side (GIF) -->
    <div class="hidden md:flex w-1/2 items-center justify-center p-4">
      <img
        src="assets/Images/Broadcast.gif"
        alt="Two Factor Authentication"
        class="w-full h-auto rounded-lg border border-gray-700 shadow-md"
      />
    </div>

    <!-- Right Side (Login Form) -->
    <div class="w-full md:w-1/2 p-4 sm:p-8 mt-8 sm:mt-16">
      <h1 class="text-2xl sm:text-3xl font-bold mb-8 text-white flex justify-center animate-fade-in">
        Login
      </h1>
      <form
        [formGroup]="_loginForm"
        (ngSubmit)="onSubmit()"
        class="bg-gray-900 bg-opacity-50 backdrop-blur-md p-6 rounded-lg shadow-lg"
      >
        <div class="mb-5">
          <label for="email" class="block text-white text-sm font-semibold mb-2">Email</label>
          <input
            type="text"
            id="email"
            name="email"
            formControlName="email"
            class="w-full px-4 py-3 rounded-lg text-white bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 placeholder-gray-400 placeholder-opacity-70"
            placeholder="Enter your email"
          />
          <div
            *ngIf="_loginForm.get('email')?.errors?.['required'] && (_loginForm.get('email')?.dirty || _loginForm.get('email')?.touched)"
            class="text-red-500 text-xs mt-2 animate-fade-in"
          >
            Email is required
          </div>
          <div
            *ngIf="_loginForm.get('email')?.errors?.['email'] && (_loginForm.get('email')?.dirty || _loginForm.get('email')?.touched)"
            class="text-red-500 text-xs mt-2 animate-fade-in"
          >
            Invalid email format
          </div>
        </div>
        <div class="mb-6">
          <label for="password" class="block text-white text-sm font-semibold mb-2">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            name="password"
            class="w-full px-4 py-3 rounded-lg text-white bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 placeholder-gray-400 placeholder-opacity-70"
            placeholder="Enter your password"
          />
          <div
            *ngIf="_loginForm.get('password')?.invalid && (_loginForm.get('password')?.dirty || _loginForm.get('password')?.touched)"
            class="text-red-500 text-xs mt-2 animate-fade-in"
          >
            Password is required
          </div>
          <a
            (click)="showDialog('top')"
            class="block mt-2 text-blue-500 hover:text-blue-400 hover:underline transition-all duration-300 cursor-pointer"
          >
            Forgot Password?
          </a>
        </div>
        <button
          type="submit"
          [disabled]="_loginForm.invalid"
          class="w-full bg-blue-500 text-white px-4 py-3 rounded-md font-semibold transition-all duration-300 ease-in-out hover:bg-blue-600 hover:scale-105 focus:outline-none focus:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Login
        </button>
      </form>
      <div class="mt-4 text-sm text-gray-300 flex justify-center">
        <span>Don't have an account?</span>
        <a
          routerLink="/signup"
          class="ml-1 text-blue-500 hover:text-blue-400 relative group transition-all duration-300"
        >
          Sign up here
          <span class="absolute left-0 bottom-0 w-0 h-[2px] bg-gradient-to-r from-blue-500 to-blue-400 transition-all duration-300 group-hover:w-full"></span>
        </a>
      </div>

      <!-- Uncomment if you want to add Google Login Button -->
      <!-- <a href="https://onlineecart.shop/auth/google" (click)="googleclick($event)">
        <button class="w-full mt-4 flex items-center justify-center bg-gray-700 text-white px-4 py-3 rounded-md font-semibold transition-all duration-300 hover:bg-gray-600">
          <img src="/assets/Images/google.png" alt="Google Authentication" class="h-6 mr-2">
          <span>Sign in with Google</span>
        </button>
      </a> -->
    </div>

    <!-- Loading Spinner -->
    <div
      *ngIf="loading"
      class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-60 rounded-xl"
    >
      <div class="w-16 h-16 border-t-4 border-blue-500 border-solid rounded-full animate-spin mb-3"></div>
      <p class="text-gray-300 text-sm">Logging in...</p>
    </div>
  </div>

  <!-- Forgot Password Dialog -->
  <form [formGroup]="_registeredEmail" (ngSubmit)="forgotpass()">
    <p-dialog
      header="Forgot Password"
      [modal]="true"
      [(visible)]="_visible"
      [position]="'center'"
      [style]="{ width: '90%', 'max-width': '25rem' }"
      class="bg-gray-800 bg-opacity-90 backdrop-blur-md rounded-lg"
    >
      <span class="p-text-secondary block mb-5 text-gray-300">Enter your Registered Email.</span>
      <div class="flex items-center gap-3 mb-5">
        <label for="email" class="font-semibold w-24 text-gray-300">Email</label>
        <input
          formControlName="registeredemail"
          pInputText
          id="email"
          class="flex-auto px-3 py-2 rounded-lg text-white bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300"
          autocomplete="off"
        />
      </div>
      <div class="flex justify-end gap-2">
        <p-button
          label="Cancel"
          class="text-red-400 hover:text-red-500 transition-colors duration-300"
          severity="secondary"
          (click)="_visible = false"
        />
        <button
          type="submit"
          label="Proceed"
          class="px-4 py-2 bg-blue-500 text-white rounded-md font-semibold transition-all duration-300 hover:bg-blue-600 focus:outline-none"
        >
          Proceed
        </button>
      </div>
    </p-dialog>
  </form>
</div>
