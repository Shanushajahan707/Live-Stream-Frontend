<div class="card mx-4 p-6 bg-gray-900 bg-opacity-90 rounded-xl shadow-2xl backdrop-blur-md">
  <p class="text-white text-lg" *ngIf="overallData">
    Total Payment: <span class="text-blue-400 text-base font-bold">{{ totalPayment | currency : "INR" }}</span>
  </p>
  <div class="date-picker-container mt-6 flex flex-col sm:flex-row items-center gap-4">
    <div class="flex items-center">
      <label class="text-white mr-2 whitespace-nowrap" for="startDate">Start Date:</label>
      <input
        class="w-40 p-2 bg-gray-800 text-white rounded-md border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"
        type="date"
        id="startDate"
        #startDateInput
      />
    </div>
    <div class="flex items-center">
      <label class="text-white mr-2 whitespace-nowrap" for="endDate">End Date:</label>
      <input
        class="w-40 p-2 bg-gray-800 text-white rounded-md border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300"
        type="date"
        id="endDate"
        #endDateInput
      />
    </div>
    <button
      class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md transition-all duration-300 mt-4 sm:mt-0"
      (click)="downloadExcelReport(startDateInput.value, endDateInput.value)"
    >
      Download Excel Report
    </button>
  </div>
  <div class="mt-6">
    <p-chart
      *ngIf="overallData; else noDataTemplate"
      type="line"
      [data]="overallData"
      [options]="options"
      style="height: 300px;"
    ></p-chart>
  </div>
  <ng-template #noDataTemplate>
    <div class="mt-6 text-center">
      <p-chart type="line" [options]="options" style="height: 300px;"></p-chart>
      <p *ngIf="!monthlySubscription" class="text-blue-300 mt-4">No data available to show</p>
    </div>
  </ng-template>
</div>
