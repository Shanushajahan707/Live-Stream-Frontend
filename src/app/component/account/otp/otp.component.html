<div>
  <div
    class="fixed z-50 top-0 w-full flex items-center justify-between bg-gradient-to-r from-gray-900 to-gray-800 bg-opacity-90 backdrop-blur-sm px-4 sm:px-6 py-4 sm:py-5 text-white shadow-md"
  >
    <!-- Logo -->
    <p
      class="text-3xl sm:text-4xl font-bold animate-fade-in bg-gradient-to-r from-blue-400 to-green-400 bg-clip-text text-transparent"
    >
      Capture
    </p>

    <!-- Navigation Buttons -->
    <div class="space-x-2 sm:space-x-3">
      <a
        routerLink="/login"
        class="rounded bg-blue-500 px-3 sm:px-4 py-2 font-bold text-white border border-blue-600 hover:bg-blue-600 hover:border-blue-500 hover:shadow-lg hover:scale-105 transition-all duration-300"
      >
        Login
      </a>
      <a
        routerLink="/signup"
        class="rounded bg-green-500 px-3 sm:px-4 py-2 font-bold text-white border border-green-600 hover:bg-green-600 hover:border-green-500 hover:shadow-lg hover:scale-105 transition-all duration-300"
      >
        Signup
      </a>
    </div>
  </div>
  <div
    class="fixed z-50 top-0 w-full flex items-center justify-between bg-gradient-to-r from-gray-900 to-gray-800 px-4 sm:px-6 py-4 sm:py-5 text-white shadow-lg"
  >
    <p class="text-3xl sm:text-4xl font-bold animate-fade-in">Capture</p>
    <div class="space-x-2 sm:space-x-3">
      <a
        routerLink="/login"
        class="rounded bg-blue-500 px-3 sm:px-4 py-2 font-bold text-white hover:bg-blue-600 transition-all duration-300 hover:scale-105"
      >
        Login
      </a>
      <a
        routerLink="/signup"
        class="rounded bg-green-500 px-3 sm:px-4 py-2 font-bold text-white hover:bg-green-600 transition-all duration-300 hover:scale-105"
      >
        Signup
      </a>
    </div>
  </div>

  <!-- OTP Form -->
  <div
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 p-4 sm:p-6 pt-20 sm:pt-24"
  >
    <div
      class="max-w-md w-full bg-gray-800 bg-opacity-70 backdrop-blur-lg p-6 sm:p-8 rounded-xl shadow-xl"
    >
      <h2
        class="text-2xl sm:text-3xl font-bold mb-8 text-white text-center animate-fade-in"
      >
        OTP Verification
      </h2>
      <form
        [formGroup]="_otpform"
        (ngSubmit)="otpsubmit()"
        (paste)="handlePaste($event)"
      >
        <div class="grid grid-cols-6 gap-2 sm:gap-4 mb-6">
          <input
            #digit1
            formControlName="digit1"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 1)"
            (keydown)="onKeyDown($event, 1)"
          />
          <input
            #digit2
            formControlName="digit2"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 2)"
            (keydown)="onKeyDown($event, 2)"
          />
          <input
            #digit3
            formControlName="digit3"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 3)"
            (keydown)="onKeyDown($event, 3)"
          />
          <input
            #digit4
            formControlName="digit4"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 4)"
            (keydown)="onKeyDown($event, 4)"
          />
          <input
            #digit5
            formControlName="digit5"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 5)"
            (keydown)="onKeyDown($event, 5)"
          />
          <input
            #digit6
            formControlName="digit6"
            type="text"
            class="col-span-1 w-full px-3 py-3 sm:py-4 text-center text-white rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-300 text-lg"
            maxlength="1"
            (input)="onDigitInput($event, 6)"
            (keydown)="onKeyDown($event, 6)"
          />
        </div>
        <!-- Validation Messages -->
        <div class="text-center mb-4">
          <div
            *ngIf="_otpform.invalid && _otpform.touched"
            class="text-red-500 text-xs animate-fade-in"
          >
            Please fill all digits correctly
          </div>
        </div>
        <button
          type="submit"
          [disabled]="_otpform.invalid"
          class="w-full bg-blue-500 text-white px-4 py-3 rounded-md font-semibold transition-all duration-300 ease-in-out hover:bg-blue-600 hover:scale-105 focus:outline-none focus:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Verify OTP
        </button>
        <div class="mt-4 text-center">
          <span *ngIf="_value">
            <span class="text-red-400 font-semibold text-sm sm:text-base">
              Time Remaining: {{ _value }}s
            </span>
          </span>
          <div *ngIf="!_value" class="text-sm text-gray-300">
            Didn't receive the code?
            <button
              *ngIf="_stop"
              (click)="resendotp()"
              class="text-blue-500 hover:text-blue-400 transition-colors duration-300"
              [disabled]="!_stop"
            >
              Resend
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
